# Every push to `fork` builds and pushes the arm64 image to ECR, then the deploy
# job waits on the `production` environment until a reviewer approves it.
# Dispatch with `tag` to redeploy an image that already exists (rollback).
name: neotex-release

on:
  push:
    branches: [fork]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image tag to deploy (e.g. 2.4.0-neotex.3). Empty builds the branch head.
        required: false
        default: ""

concurrency:
  group: neotex-release
  cancel-in-progress: false

# Images go to the private ECR repository neotex-cloud/vikunja (DAM VikunjaImageStack).
# Its registry host carries the account id, so it is read from the login step
# rather than written here.
env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: neotex-cloud/vikunja

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Fetch upstream release tags
        run: git fetch --tags --quiet https://github.com/go-vikunja/vikunja.git
      - name: Image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-$(neotex/bin/image-tag)}" >> "$GITHUB_OUTPUT"
      # The build role trusts only workflows running on refs/heads/fork, and may
      # push to the neotex-cloud/vikunja repository and nothing else.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr
      - name: Already published?
        id: exists
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Only "no such image" means build it; any other error (a missing
          # repository, a denied call) fails here rather than being taken for it.
          if err=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" 2>&1 >/dev/null); then
            echo "$ECR_REPOSITORY:$TAG already published, skipping build"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$err" != *ImageNotFoundException* ]]; then
            echo "$err" >&2
            exit 1
          elif [ -n "$INPUT_TAG" ]; then
            echo "::error::$ECR_REPOSITORY:$TAG does not exist; a dispatched tag must be an image that was already built"
            exit 1
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and push arm64 image
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          build-args: RELEASE_VERSION=v${{ steps.tag.outputs.tag }}
          # A plain image manifest rather than an index with an attestation:
          # the repository's keep-the-last-N lifecycle rule counts every
          # manifest, and could expire the image an index points at.
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/neotex-cloud/vikunja
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vikunja.neotex.cloud
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # The role allows two hours: a volume's first full snapshot can be slow.
          role-duration-seconds: 7200
      - name: Deploy
        run: neotex/bin/deploy "${{ needs.build.outputs.tag }}"
