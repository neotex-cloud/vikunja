# Daily: when upstream has a stable release newer than the one `fork` is on,
# move `main` to it, rebase our commits onto it as upgrade/<tag>, and open a
# PR against `main` for review. Approving that PR lands it (neotex-land-upgrade).
name: neotex-upstream-sync

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Re-open an upgrade whose PR was closed without landing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: neotex-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # The bot key lives in this environment, which only `fork` may use.
    environment: bot
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app
        with:
          app-id: ${{ vars.NEOTEX_BOT_APP_ID }}
          private-key: ${{ secrets.NEOTEX_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fork
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Sync with upstream
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          git config user.name "neotex-vikunja-bot[bot]"
          git config user.email "neotex-vikunja-bot[bot]@users.noreply.github.com"
          git fetch --tags --quiet https://github.com/go-vikunja/vikunja.git
          git fetch --quiet origin main fork

          # The release fork is on, not main's: main moves on the first run,
          # and a stale open PR must still be refreshed on later runs.
          from=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' origin/fork)
          next=$(neotex/bin/next-release "$from")
          if [ -z "$next" ]; then
            echo "fork is on $from; nothing newer upstream"
            exit 0
          fi
          branch="upgrade/$next"
          fork_sha=$(git rev-parse origin/fork)

          existing=$(gh pr list --head "$branch" --state all --json number,state,body --jq 'first // empty')
          number=""
          if [ -n "$existing" ]; then
            number=$(jq -r .number <<<"$existing")
            state=$(jq -r .state <<<"$existing")
            built_from=$(jq -r .body <<<"$existing" | sed -n '1s/.*fork-base=\([0-9a-f]\{40\}\).*/\1/p')
            if [ "$state" != OPEN ]; then
              if [ "$FORCE" != true ]; then
                echo "PR #$number for $next is $state; dispatch with force=true to retry"
                exit 0
              fi
              number=""
            elif [ "$built_from" = "$fork_sha" ]; then
              echo "PR #$number for $next is open and current"
              exit 0
            else
              echo "PR #$number for $next was built from $built_from; fork is now $fork_sha, refreshing"
            fi
          fi

          if [ "$(git rev-parse origin/main)" != "$(git rev-parse "$next^{commit}")" ]; then
            git push --force origin "$next^{commit}:refs/heads/main"
          fi
          neotex/bin/disable-upstream-workflows

          rc=0
          conflict=$(neotex/bin/rebase-fork "$next" "$from" origin/fork "$branch") || rc=$?
          case "$rc" in
            0) conflict="" ;;
            3) echo "$conflict" ;;
            *) exit "$rc" ;;
          esac
          git push --force origin "$branch"

          body=$(neotex/bin/upgrade-pr-body "$from" "$next" "$fork_sha" "$conflict")
          if [ -n "$number" ]; then
            gh pr edit "$number" --body "$body"
            if [ -n "$conflict" ]; then gh pr ready "$number" --undo || true; fi
          else
            gh pr create --base main --head "$branch" --title "Upgrade to Vikunja $next" \
              --body "$body" ${conflict:+--draft}
          fi

          # An older upgrade PR can no longer land (it does not build on main).
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select((.headRefName | startswith(\"upgrade/\")) and .headRefName != \"$branch\") | .number" \
            | while read -r old; do
                gh pr close "$old" --comment "Superseded by the upgrade to $next."
              done
