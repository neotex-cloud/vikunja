# Our PR checks for the neotex fork. Runs on PRs into `fork` (everyday
# changes) and into `main` (the upgrade PRs the upstream sync opens).
# Upstream's own ci.yml is disabled in this repo; its test.yml is reused
# here unchanged.
name: neotex-ci

on:
  pull_request:
    branches: [fork, main]

permissions:
  contents: read

concurrency:
  group: neotex-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: neotex script tests
        run: neotex/test/run

  upstream:
    uses: ./.github/workflows/test.yml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream release tags
        run: git fetch --tags --quiet https://github.com/go-vikunja/vikunja.git
      - name: Image tag
        id: tag
        run: echo "tag=$(neotex/bin/image-tag)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build arm64 image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: RELEASE_VERSION=v${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
