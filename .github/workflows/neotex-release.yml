# Every push to `fork` builds and publishes the arm64 image, then the deploy
# job waits on the `production` environment until a reviewer approves it.
# Dispatch with `tag` to redeploy an image that already exists (rollback).
name: neotex-release

on:
  push:
    branches: [fork]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image tag to deploy (e.g. 2.4.0-neotex.3). Empty builds the branch head.
        required: false
        default: ""

concurrency:
  group: neotex-release
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/neotex-cloud/vikunja

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Fetch upstream release tags
        run: git fetch --tags --quiet https://github.com/go-vikunja/vikunja.git
      - name: Image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-$(neotex/bin/image-tag)}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Already published?
        id: exists
        env:
          IMAGE: ${{ env.IMAGE_REPO }}:${{ steps.tag.outputs.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE already published, skipping build"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            echo "::error::$IMAGE does not exist; a dispatched tag must be an image that was already built"
            exit 1
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and push arm64 image
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ steps.tag.outputs.tag }}
          build-args: RELEASE_VERSION=v${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/neotex-cloud/vikunja
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The box can pull it anonymously
        env:
          IMAGE: ${{ env.IMAGE_REPO }}:${{ steps.tag.outputs.tag }}
        run: |
          docker logout ghcr.io
          if ! docker manifest inspect "$IMAGE" > /dev/null; then
            echo "::error::package is private; set it public (github.com/orgs/neotex-cloud/packages/container/vikunja/settings) and re-run"
            exit 1
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vikunja.neotex.cloud
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          # The role allows two hours: a volume's first full snapshot can be slow.
          role-duration-seconds: 7200
      - name: Deploy
        run: neotex/bin/deploy "${{ needs.build.outputs.tag }}"
