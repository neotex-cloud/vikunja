# Approving an upgrade PR starts the landing. This workflow runs from the
# PR's own code, so it holds no secrets and decides nothing: it only exists so
# that neotex-land-upgrade (which runs from `fork`) is triggered. That
# workflow re-checks the approval, CI and marker through the API itself.
name: neotex-land-trigger

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  land-trigger:
    if: >-
      github.event.review.state == 'approved' &&
      startsWith(github.event.pull_request.head.ref, 'upgrade/') &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Approval on an upgrade PR; neotex-land-upgrade validates it and lands it."
