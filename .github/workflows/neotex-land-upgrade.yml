# Lands an approved upgrade PR (upgrade/<tag> -> main): `fork` is moved to the
# reviewed commit and the PR is closed. GitHub's merge button cannot land a
# rebase, so this is the one place a bot moves `fork`. The push to `fork`
# starts neotex-release, which builds and waits for deploy approval.
#
# Triggered by neotex-land-trigger, but runs from `fork` (workflow_run always
# uses the default branch's file), so nobody can change this logic by pushing
# to an upgrade branch. The bot key lives in the `bot` environment, which only
# `fork` may use. neotex/bin/land-checks decides whether the PR may land.
name: neotex-land-upgrade

on:
  workflow_run:
    workflows: [neotex-land-trigger]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: neotex-land-upgrade
  cancel-in-progress: false

jobs:
  land:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: bot
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app
        with:
          app-id: ${{ vars.NEOTEX_BOT_APP_ID }}
          private-key: ${{ secrets.NEOTEX_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fork
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Land on fork
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "no open PR for $HEAD_BRANCH; nothing to land"
            exit 0
          fi
          fail() {
            gh pr comment "$pr" --body "Not landed: $1"
            echo "::error::$1"
            exit 1
          }

          rc=0
          verdict=$(neotex/bin/land-checks "$pr" 2>&1) || rc=$?
          [ "$rc" -eq 0 ] || fail "$verdict"
          read -r head fork_base <<<"$verdict"

          git fetch --quiet origin "$head"
          rc=0
          out=$(neotex/bin/land-upgrade origin "$head" "$fork_base" 2>&1) || rc=$?
          echo "$out"
          [ "$rc" -eq 0 ] || fail "$(tail -n 1 <<<"$out")"

          neotex/bin/disable-upstream-workflows
          gh pr close "$pr" --comment "Landed on fork at $head; the release workflow will build and wait for deploy approval."
